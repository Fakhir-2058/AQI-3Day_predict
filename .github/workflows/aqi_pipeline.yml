name: AQI Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Select what to test'
        required: true
        default: 'prediction_only'
        type: choice
        options:
          - prediction_only
          - all_scripts

  schedule:
    - cron: "0 * * * *"
    - cron: "20 21 * * *"

jobs:

  # -------------------------------------------------------------
  # TEST PREDICTION ONLY
  # -------------------------------------------------------------
  test-prediction:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_target == 'prediction_only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prediction File
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          # Runs api/index.py or prediction_script.py depending on your setup
          python -c "import api.index" || python prediction_script.py


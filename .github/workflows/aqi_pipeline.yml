name: AQI Automation Pipeline

on:

  workflow_dispatch:

  schedule:

    # Run hourly data collection every hour
    - cron: "0 * * * *"

    # Run daily feature engineering and training every day at 01:30 UTC
    - cron: "30 1 * * *"


